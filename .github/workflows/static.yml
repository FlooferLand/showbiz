name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew runDatagen
          ./gradlew assemble

      - name: Building staticy things into the static page
        env:
          BUILD: ${{ github.run_number }}
        run: |
          JAR=$(ls versions/1.21.1/build/libs/showbiz-*+1.21.1.jar)
          cp "$JAR" website/nightly.jar
      
          VERSION=$(basename "$JAR" .jar)
          VERSION=${VERSION#showbiz-}
          SHA=${GITHUB_SHA::7}
          COMMIT=$(git log -1 --pretty=%s)
      
          sed -i \
            -e "s|{{BUILD}}|$BUILD|g" \
            -e "s|{{SHA}}|$SHA|g" \
            -e "s|{{COMMIT}}|$COMMIT|g" \
            -e "s|{{VERSION}}|$VERSION|g" \
            website/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - id: deployment
        uses: actions/deploy-pages@v4
