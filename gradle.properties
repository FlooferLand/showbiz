kotlin.code.style = official

# Increase Gradle performance and fix JNA warnings with Java 25 JVMs
net.minecraft.jvmargs = --enable-native-access=ALL-UNNAMED
net.minecraft.jvmargs.devonly =
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx6G
org.gradle.parallel = true

# Mod
mod.id = showbiz
mod.version = 0.6.0-beta
mod.modrinthId = wJ32u9Oq
mod.curseforgeId = 1452536

# Main dependencies
deps.minecraft = [VERSIONED]
deps.fabric_api = [VERSIONED]
deps.fabric_loom = 1.19-SNAPSHOT
deps.fabric_loader = 0.20.1
deps.fabric_language_kotlin = 1.14.1+kotlin.2.4.20
deps.kotlin_json = 1.11.0
deps.kotlin = 2.4.20
deps.ktoml = 0.7.1
deps.xmlutil = 1.0.2
deps.jserialcomm = 2.11.4
deps.veil = 4.5.2
deps.irlights = 1.1.8
deps.irlights_core = v1.1
deps.cctweaked = 1.121.0

# Showbiz data library (https://github.com/FlooferLand/bizlib)
