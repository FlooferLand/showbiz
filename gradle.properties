kotlin.code.style = official

# Increase Gradle performance and fix JNA warnings with Java 25 JVMs
# TODO: Turn on configuration cache; Disabled currently due to Gradle crying
net.minecraft.jvmargs = -XX:+AllowEnhancedClassRedefinition --enable-native-access=ALL-UNNAMED
