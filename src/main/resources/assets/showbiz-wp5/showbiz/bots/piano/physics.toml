format = 1

[cylinders.rae]
psi = 80.0           # the air supply
rate = 60.0          # cylinder steps a second (Faz-Anim steps once a frame, only 60 matches it)

# One cylinder per bit: today's motion, converted.
# curve: smooth (Faz-Anim's clips), linear, or bitmap (the bitmap's own easing). dual_pressure_bit 0: none
[bits.rae]
1    = { flow_in = 0.8, flow_out = 1.0, gravity_in = 1.0, gravity_out = 1.0, psi_scale = 0.65625, smash_in = 0.0, smash_out = 0.0, smash_speed_in = 0.1, smash_speed_out = 0.1, dual_pressure_bit = 0, dual_pressure_scale = 1.0, curve = "bitmap" }

[cylinders.wp5]
psi = 80.0           # the air supply
rate = 60.0          # cylinder steps a second (Faz-Anim steps once a frame, only 60 matches it)

# One cylinder per bit: today's motion, converted.
# curve: smooth (Faz-Anim's clips), linear, or bitmap (the bitmap's own easing). dual_pressure_bit 0: none
[bits.wp5]
1    = { flow_in = 0.8, flow_out = 1.0, gravity_in = 1.0, gravity_out = 1.0, psi_scale = 0.65625, smash_in = 0.0, smash_out = 0.0, smash_speed_in = 0.1, smash_speed_out = 0.1, dual_pressure_bit = 0, dual_pressure_scale = 1.0, curve = "bitmap" }
