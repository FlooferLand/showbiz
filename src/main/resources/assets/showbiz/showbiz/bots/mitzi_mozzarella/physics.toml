# showbiz:mitzi_mozzarella
format = 1

[chains."Pom*"]
col_step = 4              #-how many pixels wide each chain is
step = 2                  #-how many pixels tall each link is
sim_segments = 8          #-physics points per chain (more is smoother, but slower)
gravity = 0.04            #-how hard chains fall (0.08 is Minecraft's gravity)
rope_damp = 0.85          #-speed kept each tick: lower stops sooner, higher swings longer
stiff = 0.02              #-pull back to the modelled shape, 0.0 is a loose rope
stiff_falloff = 3.0       #-how fast that pull fades toward the tip
bend_stiff = 0.12         #-how much joints resist bending, smooths out kinks
max_bend = 2000.0         #-bend limit in degrees (out of reach on purpose)
soft_band = 0.5           #-how gently that limit kicks in
proj_clamp = 1.5          #-safety: the most a joint can jump in one step
substep_cap = 16          #-safety: the most physics steps in one frame
lag = 3                   #-each chain trails the hand by up to this many frames
anchor_smooth = 0.55      #-smooths the hand: higher follows tighter, 0.0 is off
pin_lag_max = 0.04        #-furthest the smoothing lets chains fall behind, in blocks
sleep = 0.0004            #-slower than this, a chain rests and costs nothing...
wake = 0.0002             #-...until the hand moves faster than this
repel = 0.5               #-how hard chains push each other apart, 0.0 is off
repel_radius = 0.12       #-how close chains get before pushing, in blocks
repel_cap = 0.0           #-the most one push can move a joint, 0.0 is no limit
repel_up = 1.0            #-how much pushes can go up or down, 0.0 is sideways only
render_cone = 110.0       #-most a link can turn from its modelled angle, in degrees
fixed_step = 0.16666667   #-physics step length in ticks, so it looks the same at any fps
sweep_exit = false        #-skips extra work once chains settle (off until checked)

