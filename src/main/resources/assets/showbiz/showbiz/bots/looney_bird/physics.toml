format = 1

# While dual_pressure_bit is on, every cylinder's psi x dual_pressure_scale. A bit's own line can set either
[cylinders.rae]
dual_pressure_bit = 211
dual_pressure_scale = 0.75

# One cylinder per bit: Reel to Real's own values.
# curve: smooth (Faz-Anim's clips), linear, or bitmap (the bitmap's own easing)
